<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Travel Agency</title>

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<!-- Font Awesome Icons -->
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

/* GENERAL */
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#f7f9fc;
color:#333;
}

/* SECTION TITLE */
.section-title{
text-align:center;
margin:60px 0 30px;
font-size:32px;
font-weight:700;
color:#0a3d62;
}

/* ================= GALLERY ================= */

.gallery{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
padding:0 40px 60px;
}

.gallery-item{
overflow:hidden;
border-radius:12px;
position:relative;
}

.gallery-item img{
width:100%;
height:300px;
object-fit:cover;
transition:transform .6s ease, filter .6s ease;
}

.gallery-item:hover img{
transform:scale(1.2);
filter:brightness(70%);
}

.gallery-caption{
position:absolute;
bottom:0;
left:0;
right:0;
color:white;
padding:15px;
background:linear-gradient(transparent, rgba(0,0,0,0.7));
opacity:0;
transition:.5s;
}

.gallery-item:hover .gallery-caption{
opacity:1;
}

/* ================= CONTACT ================= */

.contact{
background:#0a3d62;
color:white;
padding:70px 40px;
display:flex;
flex-wrap:wrap;
gap:40px;
justify-content:center;
}

.contact-info,
.contact-form{
flex:1;
min-width:280px;
}

.contact h2{
margin-bottom:20px;
}

.contact p{
margin-bottom:10px;
}

.contact-form input,
.contact-form textarea{
width:100%;
padding:12px;
margin-bottom:15px;
border:none;
border-radius:6px;
}

.contact-form button{
background:#ff9f1a;
border:none;
padding:12px 20px;
color:white;
font-size:16px;
border-radius:6px;
cursor:pointer;
transition:.3s;
}

.contact-form button:hover{
background:#ff7f00;
}

/* ================= FOOTER ================= */

footer{
background:#021c2b;
color:white;
text-align:center;
padding:30px 20px;

}

.social-icons{
margin:15px 0;
}

.social-icons a{
color:white;
margin:0 10px;
font-size:22px;
transition:.3s;
}

.social-icons a:hover{
color:#ff9f1a;
transform:translateY(-4px);
}

footer p{
font-size:14px;
opacity:.8;
}

</style>
</head>

<body>

<!-- ================= GALLERY ================= -->

<h2 class="section-title">Explore Destinations</h2>

<section class="gallery">

<div class="gallery-item">
<img src="Tour fazu.jpg">
<div class="gallery-caption">Maldives Beach</div>
</div>

<div class="gallery-item">
<img src="https://source.unsplash.com/600x600/?paris,travel">
<div class="gallery-caption">Paris City</div>
</div>

<div class="gallery-item">
<img src="https://source.unsplash.com/600x600/?mountain,travel">
<div class="gallery-caption">Mountain Adventure</div>
</div>

<div class="gallery-item">
<img src="https://source.unsplash.com/600x600/?safari,africa">
<div class="gallery-caption">African Safari</div>
</div>

</section>

<!-- ================= CONTACT ================= -->

<section class="contact">

<div class="contact-info">
<h2>Contact Us</h2>
<p><i class="fa fa-location-dot"></i> Lagos, Nigeria</p>
<p><i class="fa fa-phone"></i> +234 000 000 0000</p>
<p><i class="fa fa-envelope"></i> travel@agency.com</p>
<p>Plan your next adventure with us. Let's make your dream trip unforgettable.</p>
</div>

<div class="contact-form">
<h2>Send Message</h2>

<form>
<input type="text" placeholder="Your Name" required>
<input type="email" placeholder="Email Address" required>
<textarea rows="5" placeholder="Your Message"></textarea>
<button type="submit">Send Message</button>
</form>

</div>

</section>

<!-- ================= FOOTER ================= -->

<footer>

<h3>Travel Agency</h3>

<div class="social-icons">
<a href="#"><i class="fab fa-facebook"></i></a>
<a href="#"><i class="fab fa-instagram"></i></a>
<a href="#"><i class="fab fa-twitter"></i></a>
<a href="#"><i class="fab fa-linkedin"></i></a>
</div>

<p>© 2026 Travel Agency. All Rights Reserved.</p>

</footer>

</body>
</html>
