<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}
        .gallery{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
padding:0 40px 60px;
}
.gallery-item{
overflow:hidden;
border-radius:20px;
position:relative;
}
.gallery-item img{
width:100%;
height:300px;
object-fit:cover;
transition:transform .6s ease, filter .6s ease;
}
.gallery-item:hover img{
transform:scale(1.2);
filter:brightness(70%);
}
.gallery-caption{
position:absolute;
bottom:0;
left:0;
right:0;
color:white;
padding:15px;
background:linear-gradient(transparent, rgba(0,0,0,0.7));
opacity:0;
transition:.5s;
}
.gallery-item:hover .gallery-caption{
opacity:1;
}


    </style>
</head>
<body>
   <section class="gallery">

<div class="gallery-item">
<img src="Tour fazu.jpg">
<div class="gallery-caption">Maldives Beach</div>
</div>
<div class="gallery-item">
<img src="IMG_8229.JPG">
<div class="gallery-caption">Paris City</div>
</div>
<div class="gallery-item">
<img src="https://source.unsplash.com/600x600/?safari,africa">
<div class="gallery-caption">African Safari</div>
</div>
</section>
 
</body>
</html>
